name: Validate Croissant Metadata

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-croissant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v4

      - name: Validate Croissant schema with Marketplace action
        uses: ssciwr/validate-croissant-schema@v0
        with:
          file: croissant.json
          python-version: "3.10"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt

      - name: Validate Croissant package integrity
        run: python scripts/validate_croissant_integrity.py --root . --croissant croissant.json
